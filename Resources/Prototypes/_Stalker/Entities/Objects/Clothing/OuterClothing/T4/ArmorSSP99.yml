# Base
- type: entity
  parent: STClothingOuterArmorStorageBasic
  id: STClothingOuterArmorSSP99Base
  name: ССП-99 # base
  abstract: true
  suffix: ST, T4, Env
  components:
    - type: STWeight
      self: 7
    - type: PullDoAfter
      pullTime: 2
    - type: Craftable
    - type: Sprite
      sprite: _Stalker/Objects/Clothing/outerClothing/ssp99.rsi
    - type: Clothing
      sprite: _Stalker/Objects/Clothing/outerClothing/ssp99.rsi
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetSSP99
    - type: Storage
      maxItemSize: Huge
      blacklist:
        tags:
          - STArtifact
      grid:
        - 0,0,5,3
        - 7,0,10,3
        - 7,0,12,3
    - type: Armor
      armorClass: 3 
      modifiers:
        flatReductions:
          Blunt: 2
          Slash: 2
          Piercing: 1
          Heat: 3
          Caustic: 3
          Radiation: 3
          Shock: 3
          Compression: 0.25
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.85 
          Heat: 0.5
          Caustic: 0.5
          Shock: 0.5
          Radiation: 0.6
          Compression: 0.55
    - type: GrantsArtifactSlots
      slots: 5 # EN
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95
    - type: ContainerContainer
      containers:
        toggleable-clothing: !type:ContainerSlot {}
        storagebase: !type:Container
          ents: []
    - type: Tag
      tags:
        - BlockBack
    - type: Item
      size: Ginormous

- type: entity
  parent: ClothingHeadHardsuitBase
  id: STClothingHeadHelmetSSP99Base
