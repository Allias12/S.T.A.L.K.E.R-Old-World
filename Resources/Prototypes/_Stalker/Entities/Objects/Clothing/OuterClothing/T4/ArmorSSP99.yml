  categories: [ HideSpawnMenu ]
  abstract: true
  components:
    - type: Armor
      armorClass: 3
      modifiers:
        flatReductions:
          Blunt: 2
          Slash: 2
          Piercing: 1
          Heat: 2
          Caustic: 2
          Radiation: 2
          Shock: 2
          Psy: 3
        coefficients:
          Blunt: 0.85
          Slash: 0.85
          Piercing: 0.85
          Heat: 0.9
          Radiation: 0.8
          Caustic: 0.8
          Shock: 0.85
          Compression: 0.65
    - type: Sprite
      sprite: _Stalker/Objects/Clothing/hats/ssp99_helm.rsi
